<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Write how you feel and see it as a picture and a score." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#4338ca" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Viz it</title>
    <script>
      // Apply the saved theme before first paint so there's no flash of the wrong colors.
      try {
        var saved = JSON.parse(localStorage.getItem('moodcanvas.theme'));
        if (['light', 'dark', 'contrast', 'system'].indexOf(saved) >= 0) document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
