<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Viz it" />
    <meta name="description" content="Write what you feel and where you want to be, and get a guided visualization made for you." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f3fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090d1f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Viz it</title>
    <script>
      // Apply the saved theme before first paint so there's no flash of the wrong colors.
      try {
        var saved = JSON.parse(localStorage.getItem('moodcanvas.theme'));
        if (['light', 'dark', 'contrast', 'system'].indexOf(saved) >= 0) document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
